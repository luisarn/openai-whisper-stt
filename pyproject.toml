[project]
name = "openai-whisper-stt"
version = "0.1.0"
description = "OpenAI Whisper API compatible STT service using mlx-whisper (whisper-large-v3-turbo) on Apple Silicon"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.95.1",
    "ffmpeg-python>=0.2.0",
    "mlx-whisper>=0.4.2",
    "openai>=2.8.1",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.20",
    "requests>=2.32.5",
    "uvicorn>=0.38.0",
]
